name: Build & Release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 시크릿이 없어 디버그 키로 서명합니다."
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Read version
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "EraAndroid-v$name.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EraAndroid-v${{ steps.version.outputs.name }}
          path: EraAndroid-v${{ steps.version.outputs.name }}.apk

      # main 브랜치에 올라왔고, 해당 버전의 릴리즈가 아직 없을 때만 릴리즈 생성
      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "릴리즈 $tag 가 이미 있어 건너뜁니다. 새 릴리즈를 만들려면 versionName을 올리세요."
          else
            gh release create "$tag" "EraAndroid-v$VERSION.apk" \
              --title "EraAndroid $tag" --generate-notes --target "$GITHUB_SHA"
          fi
